[package]
name = "order-tool"
version = "0.1.0"
edition = "2024"

[dependencies]
reorder-common = { path = "../reorder-common" }
ndarray = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
